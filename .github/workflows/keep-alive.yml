name: Keep Render instance awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed site
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://khalid-portfolio.onrender.com/)
          echo "Response code: $code"
